<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microhub</title>
  <link href="./tailwind/output.css" rel="stylesheet">
  <link rel="shortcut icon" href="/assets/img/logo/icon-128.ico" type="image/x-icon">
</head>

<body class="w-dvw bg-slate-950 text-slate-50 font-mono font-light">
  <header class="w-full bg-slate-950 flex items-center justify-around py-6 px-8 border-y border-slate-700 z-50 fixed overflow-hidden">
    <div>
      <img 
        src="/assets/img/logo/logo-light.svg" 
        alt="Logo da Microhub" 
        class="max-h-11"
      >
    </div>
    <nav class="flex gap-6 text-slate-300 *:border-b *:border-b-transparent *:hover:border-b-slate-100 *:cursor-pointer *:hover:text-slate-50 *:transition-all *:duration-300">
      <ul>Início</ul>
      <ul>Solução</ul>
      <ul>FAQ</ul>
      <ul>Contate-nos</ul>
    </nav>
    <div class="flex gap-4 *:cursor-pointer relative">
      <button class="min-w-32 py-2 border border-slate-50 rounded-lg hover:bg-slate-50 transition-colors duration-300 hover:text-blue-600">Entrar</button>
      <button class="min-w-32 py-2 border border-blue-600 rounded-lg hover:bg-blue-600 transition-colors duration-300">Cadastre-se</button>
      <div class="w-60 h-16 bg-blue-800 absolute -top-24 -right-32 blur-3xl"></div>
    </div>
  </header>
</body>

</html>
