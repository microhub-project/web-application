<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microhub</title>
  <link href="./tailwind/output.css" rel="stylesheet">
  <link rel="shortcut icon" href="/assets/img/logo/icon-128.ico" type="image/x-icon">
</head>

<body class="bg-slate-950 text-slate-50 font-mono font-normal overflow-x-hidden antialiased *:selection:bg-blue-50 *:selection:text-indigo-900">
  <div class="bg-noise"></div>
  <header class="w-full bg-slate-950 flex items-center justify-around py-6 px-8 border-y border-slate-700 z-50 fixed overflow-hidden">
    <div>
      <img 
        src="/assets/img/logo/logo-light.svg" 
        alt="Logo da Microhub" 
        class="max-h-11"
      >
    </div>
    <nav class="flex gap-6 text-slate-300 *:border-b *:border-b-transparent *:hover:border-b-slate-100 *:cursor-pointer *:hover:text-slate-50 *:transition-all *:duration-300">
      <ul>Início</ul>
      <ul>Solução</ul>
      <ul>FAQ</ul>
      <ul>Contate-nos</ul>
    </nav>
    <div class="flex gap-4 *:cursor-pointer relative">
      <button class="min-w-32 py-2 border border-slate-50 rounded-lg hover:bg-slate-50 transition-colors duration-300 hover:text-blue-600">Entrar</button>
      <button class="min-w-32 py-2 border border-blue-600 rounded-lg hover:bg-blue-600 transition-colors duration-300">Cadastre-se</button>
      <div class="w-60 h-16 bg-blue-800 absolute -top-24 -right-32 blur-3xl"></div>
    </div>
  </header>
  <main class="flex flex-col items-center justify-center px-4 max-w-6xl mx-auto">
    <section id="home" class="w-full min-h-[85dvh] flex flex-col items-center justify-center text-center gap-6 relative">
      <div class="w-xl h-40 bg-blue-800 absolute top-0 -left-56 blur-[8rem] rotate-45"></div>
      <div class="flex flex-col items-center justify-center gap-3">
        <h1 class="text-5xl max-w-4xl font-semibold bg-linear-120 from-blue-600 via-blue-400 to-indigo-600 via-35% bg-clip-text text-transparent animate-aurora-text bg-size-[200%_auto]">
          Visibilidade para sua infraestrutura nos momentos que mais importam.
        </h1>
        <p class="text-slate-200 max-w-5xl">
          Monitore CPU, memória e rede dos seus microsserviços em um único dashboard e identifique rapidamente sinais de sobrecarga e degradação de desempenho.
        </p>
      </div>
      <button class="cursor-pointer min-w-32 py-2 px-6 bg-blue-500 shadow-lg shadow-blue-500 rounded-lg hover:shadow-xl hover:scale-102 transition-all duration-300">Conheça a solução</button>
    </section>
  </main>
</body>

</html>
