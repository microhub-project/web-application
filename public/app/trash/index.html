<!DOCTYPE html>
<html lang="en">
<script src="https://cdn.tailwindcss.com"></script>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microhub</title>
    <link rel="stylesheet" href="../../tailwind/output.css">
    <link rel="shortcut icon" href="/assets/img/logo/icon-128.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css"
        href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" type="text/css"
        href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css" />

    <script type="module">
        import { fillUserInfos, verifyIfUserCanAccess } from "../../js/session.js";

        window.addEventListener("DOMContentLoaded", () => {
            fillUserInfos();
            verifyIfUserCanAccess();
        });
    </script>
    <script src="./script.js"></script>
    <script src="../../js/toast.js"></script>

</head>

<body class="bg-slate-200 text-slate-50 font-mono font-normal overflow-x-hidden antialiased relative h-dvh">

    <div class="flex min-h-screen">

        <header id="header-main" class="max-lg:hidden">
            <nav
                class="w-72 fixed left-0 top-0 h-screen bg-slate-900 border-r border-slate-800 flex flex-col px-6 py-9 shrink-0 justify-between z-40">
                <div class="flex items-center justify-center -ml-5">
                    <img src="/assets/img/logo/logo-light.svg" alt="Logo da Microhub" class="max-h-11">
                </div>

                <div class="flex flex-col gap-8">
                    <a href="../index.html" id="navItemGeneral"
                        class="text-slate-300 hover:text-blue-400 font-medium transition-colors flex items-center gap-3 text-xl cursor-pointer">
                        <i class="ph ph-house text-2xl"></i> Geral
                    </a>
                    <a href="../reports/index.html" id="navItemReports"
                        class="text-slate-300 hover:text-blue-400 font-medium transition-colors flex items-center gap-3 text-xl cursor-pointer">
                        <i class="ph ph-files text-2xl"></i> Relatórios
                    </a>
                    <a href="../alerts/index.html" id="navItemAlerts"
                        class="text-slate-300 hover:text-blue-400 font-medium transition-colors flex items-center gap-3 text-xl cursor-pointer">
                        <i class="ph ph-warning text-2xl"></i> Alertas
                    </a>
                    <a href="../finances/index.html" id="navItemFinances"
                        class="text-slate-300 hover:text-blue-400 font-medium transition-colors flex items-center gap-3 text-xl cursor-pointer">
                        <i class="ph ph-money text-2xl"></i> Finanças
                    </a>
                    <a href="../microservices/index.html" id="navItemMicroservices"
                        class="text-slate-300 hover:text-blue-400 font-medium transition-colors flex items-center gap-3 text-xl cursor-pointer">
                        <i class="ph ph-cube text-2xl"></i> Microsserviços
                    </a>
                    <a href="../instances/index.html" id="navItemInstances"
                        class="text-slate-300 hover:text-blue-400 font-medium transition-colors hidden items-center gap-3 text-xl cursor-pointer">
                        <i class="ph ph-computer-tower text-2xl"></i> Instâncias
                    </a>
                    <a href="../users/index.html" id="navItemUsers"
                        class="text-slate-300 hover:text-blue-400 font-medium transition-colors hidden items-center gap-3 text-xl cursor-pointer">
                        <i class="ph ph-user text-2xl"></i> Usuários
                    </a>
                    <a href="../codes/index.html" id="navItemCodes"
                        class="text-slate-300 hover:text-blue-400 font-medium transition-colors hidden items-center gap-3 text-xl cursor-pointer">
                        <i class="ph ph-lock text-2xl"></i> Códigos
                    </a>
                    <a href="#" id="navItemTrash"
                        class="text-slate-300 hover:text-blue-400 font-medium transition-colors flex items-center gap-3 text-xl cursor-pointer">
                        <i class="ph ph-trash text-2xl"></i> Lixeira
                    </a>
                </div>
                <div class="flex justify-around items-center bg-slate-800 py-3 rounded">
                    <div id="navUserIcon"
                        class="rounded-full bg-slate-950 size-10 flex justify-center items-center font-bold">
                        US
                    </div>
                    <div id="navUserName" class="font-semibold">
                        Usuário
                    </div>
                    <div>
                        <a onclick="logout()"><i class="ph ph-sign-out text-2xl cursor-pointer"></i></a>
                    </div>
                </div>
            </nav>
        </header>

        <header id="header-mobile" class="lg:hidden">
            <nav
                class="w-20 fixed right-0 top-0 h-screen bg-slate-900 border-l border-slate-800 flex flex-col items-center px-4 py-9 shrink-0 justify-between z-40">
                <div class="flex items-center justify-center w-full">
                    <img src="/assets/img/logo/icon-light.svg" alt="Logo da Microhub" class="max-h-11">
                </div>

                <div class="flex flex-col items-center justify-center gap-8 w-full">
                    <a href="../index.html" id="navItemGeneralMobile"
                        class="text-slate-300 hover:text-blue-400 font-medium transition-colors flex items-center justify-center text-xl cursor-pointer">
                        <i class="ph ph-house text-3xl"></i>
                    </a>
                    <a href="../reports/index.html" id="navItemReportsMobile"
                        class="text-slate-300 hover:text-blue-400 font-medium transition-colors flex items-center justify-center text-xl cursor-pointer">
                        <i class="ph ph-files text-3xl"></i>
                    </a>
                    <a href="../alerts/index.html" id="navItemAlertsMobile"
                        class="text-slate-300 hover:text-blue-400 font-medium transition-colors flex items-center justify-center text-xl cursor-pointer">
                        <i class="ph ph-warning text-3xl"></i>
                    </a>
                    <a href="../finances/index.html" id="navItemFinancesMobile"
                        class="text-slate-300 hover:text-blue-400 font-medium transition-colors flex items-center justify-center text-xl cursor-pointer">
                        <i class="ph ph-money text-3xl"></i>
                    </a>
                    <a href="../microservices/index.html" id="navItemMicroservicesMobile"
                        class="text-slate-300 hover:text-blue-400 font-medium transition-colors flex items-center justify-center text-xl cursor-pointer">
                        <i class="ph ph-cube text-3xl"></i>
                    </a>
                    <a href="../instances/index.html" id="navItemInstancesMobile"
                        class="text-slate-300 hover:text-blue-400 font-medium transition-colors hidden items-center justify-center text-xl cursor-pointer">
                        <i class="ph ph-computer-tower text-3xl"></i>
                    </a>
                    <a href="../users/index.html" id="navItemUsersMobile"
                        class="text-slate-300 hover:text-blue-400 font-medium transition-colors hidden items-center justify-center text-xl cursor-pointer">
                        <i class="ph ph-user text-3xl"></i>
                    </a>
                    <a href="../codes/index.html" id="navItemCodesMobile"
                        class="text-slate-300 hover:text-blue-400 font-medium transition-colors hidden items-center justify-center text-xl cursor-pointer">
                        <i class="ph ph-lock text-3xl"></i>
                    </a>
                    <a href="#" id="navItemTrashMobile"
                        class="text-slate-300 hover:text-blue-400 font-medium transition-colors hidden items-center justify-center text-xl cursor-pointer">
                        <i class="ph ph-trash text-3xl"></i>
                    </a>
                </div>
                <div class="flex flex-col justify-center items-center p-2 gap-4 bg-slate-800 py-3 rounded w-full">
                    <div id="navUserIconMobile"
                        class="rounded-full bg-slate-950 size-10 flex justify-center items-center font-bold">
                        US
                    </div>
                    <div>
                        <a onclick="logout()"><i class="ph ph-sign-out text-3xl cursor-pointer"></i></a>
                    </div>
                </div>
            </nav>
        </header>

        <main
            class="text-slate-900 flex flex-col p-8 min-h-dvh gap-12 w-full lg:ml-72 lg:w-[calc(100%-18rem)] max-lg:pr-24">

            <div class="flex flex-col gap-4 w-full">
                <div class="">
                    <h1 class="text-2xl font-extrabold">Lixeira</h1>
                </div>
                <hr class="border-t border-slate-400 my-5">
            </div>
        </main>
        <div id="toast-container"
            class="fixed w-xs bottom-4 right-4 pointer-events-none z-90 max-h-[calc(100dvh-8rem)] flex flex-col-reverse gap-2 overflow-hidden">
        </div>
</body>

</html>
