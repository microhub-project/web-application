<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microhub</title>
  <link rel="stylesheet" href="../../tailwind/output.css">
  <link rel="stylesheet" href="../assets/img/logo/icon-128.ico" type="image/x-icon">
  <link rel="stylesheet" type="text/css"
    href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" type="text/css"
    href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css" />

  <script src="./script.js"></script>
  <script src="../../js/session.js"></script>
  <script src="../../js/toast.js"></script>

</head>

<body onload="fillUserInfos();"
  class="bg-slate-200 text-slate-50 font-mono font-normal overflow-x-hidden antialiased relative h-dvh">

  <div id="toast-container" class="fixed top-5 right-5 z-100 w-80 space-y-2"></div>

  <div class="flex min-h-screen">

    <nav
      class="w-72 fixed h-screen bg-slate-900 border-r border-slate-800 flex flex-col px-6 py-9 shrink-0 justify-between z-100">
      <div class="flex items-center justify-center -ml-5">
        <img src="/assets/img/logo/logo-light.svg" alt="Logo da Microhub" class="max-h-11">
      </div>

      <div class="flex flex-col gap-8">
        <a href="../index.html"
          class="text-slate-300 hover:text-blue-400 font-medium transition-colors flex items-center gap-3 text-xl cursor-pointer">
          <i class="ph ph-house text-2xl"></i> Geral
        </a>
        <a href="#"
          class="text-slate-300 hover:text-blue-400 font-medium transition-colors flex items-center gap-3 text-xl cursor-pointer">
          <i class="ph ph-hard-drives text-2xl"></i> Aplicações
        </a>
        <a href="#"
          class="text-slate-300 hover:text-blue-400 font-medium transition-colors flex items-center gap-3 text-xl cursor-pointer">
          <i class="ph ph-bell text-2xl"></i> Histórico Alertas
        </a>
        <a href="#" id="navItemUsers"
          class="text-slate-300 hover:text-blue-400 font-medium transition-colors hidden items-center gap-3 text-xl cursor-pointer">
          <i class="ph ph-user text-2xl"></i> Usuários
        </a>
        <a id="navItemCodes"
          class="text-slate-300 hover:text-blue-400 font-medium transition-colors hidden items-center gap-3 text-xl cursor-pointer">
          <i class="ph ph-lock text-2xl"></i> Códigos
        </a>
      </div>
      <div class="flex justify-around items-center bg-slate-800 py-3 rounded">
        <div id="navUserIcon" class="rounded-full bg-slate-950 size-10 flex justify-center items-center font-bold">
          US
        </div>
        <div id="navUserName" class="font-semibold">
          Usuário
        </div>
        <div>
          <a onclick="logout()"><i class="ph ph-sign-out text-2xl cursor-pointer"></i></a>
        </div>
      </div>
    </nav>

    <main class="text-slate-900 flex flex-col p-8 absolute right-0 top-0 w-[calc(100dvw-18rem)] min-h-dvh gap-12">

      <div class="flex flex-col gap-4 w-full">
        <div class="">
          <h1 class="text-2xl font-extrabold">Usuários</h1>
          <h1 class="text-3xl font-extrabold pl-4 text-blue-950">@ Empresa</h1>
        </div>
        <hr class="border-t border-slate-400 my-5">

        <div class="text-3xl flex items-center justify-between w-full">
          <h1>Informações do usuário</h1>
        </div>

        <div class="flex items-center gap-3">
          <input id="input_pesquisa"
            class="relative text-slate-950 bg-slate-50 w-64 h-10 px-4 border border-slate-400 rounded-full left-240"
            placeholder="Insira o nome">

          <button onclick="Pesquisar()"
            class=" relative px-4 py-3 bg-blue-300 hover:bg-blue-500 rounded-full cursor-pointer flex items-center gap-2 w-35 h-8 left-240">

            <i class="ph ph-magnifying-glass"></i>
            pesquisar
          </button>
        </div>


        <div id="listarUsuarios" class="w-full flex flex-col gap-2 relative top-10">
          <div class="grid grid-cols-12 px-5 font-bold text-slate-700 ">
            <span class="col-span-5">Nome</span>
            <span class="col-span-4">Cargo</span>
            <span class="col-span-3 text-right">Ações</span>
          </div>
        </div>



        <div id="updateUser"
          class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm items-center justify-center p-4">

          <div class="relative w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl p-8 shadow-2xl">

            <button onclick="fecharAtualizar()"
              class="absolute top-4 right-4 text-slate-400 hover:text-white text-2xl cursor-pointer">
              &times;
            </button>

            <h2 class="text-2xl font-semibold text-white mb-6">
              Atualizar usuário
            </h2>

            <label class="relative bottom-2 text-slate-200 font-medium">O que deseja atualizar?</label>


            <select id="opcaoAtualizar" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl
               text-slate-100 outline-none focus:border-blue-500
               focus:ring-1 focus:ring-blue-500 transition-colors cursor-pointer" onchange="mostrarCampoAtualizar()">

              <option value="" class="bg-slate-800">Selecione uma opção</option>
              <option value="nome" class="bg-slate-800">Nome</option>
              <option value="email" class="bg-slate-800">E-mail</option>
              <option value="cargo" class="bg-slate-800">Cargo</option>

            </select>

            <div id="campoNome" class="hidden flex-col gap-2 mt-4">
              <label class="text-slate-200 font-medium">
                Novo nome
              </label>

              <input id="nomeAtualizar" type="text" placeholder="Digite o novo nome" class="w-full px-4 py-3 bg-slate-800 border border-slate-700
               rounded-xl text-slate-100 outline-none
               focus:border-blue-500 focus:ring-1 focus:ring-blue-500
               transition-colors cursor-pointer">
            </div>

            <div id="campoEmail" class="hidden flex-col gap-2 mt-4">
              <label class="text-slate-200 font-medium">
                Novo e-mail
              </label>

              <input id="emailAtualizar" type="email" placeholder="Digite o novo e-mail" class="w-full px-4 py-3 bg-slate-800 border border-slate-700
               rounded-xl text-slate-100 outline-none
               focus:border-blue-500 focus:ring-1 focus:ring-blue-500
               transition-colors cursor-pointer">
            </div>

            <div id="campoCargo" class="hidden flex-col gap-2 mt-4">
              <label class="text-slate-200 font-medium">
                Novo cargo
              </label>

              <select id="cargoAtualizar" class="w-full px-4 py-3 bg-slate-800 border border-slate-700
               rounded-xl text-slate-100 outline-none
               focus:border-blue-500 focus:ring-1 focus:ring-blue-500
               transition-colors cursor-pointer">

                <option value="1" class="bg-slate-800">Gerente</option>
                <option value="2" class="bg-slate-800">FinOps</option>
                <option value="3" class="bg-slate-800">Dev/DevOps</option>

              </select>
            </div>
            <br>
            <button id="btnConfirmarAtualizacao" type="button" onclick="salvarAtualizacao()"
              class="hidden w-full py-2 bg-blue-500 hover:bg-blue-600 rounded-xl font-medium text-white transition-colors cursor-pointer">
              <i class="ph ph-check mr-1"></i>
              Confirmar atualização
            </button>
          </div>
        </div>



        <div id="deleteUser"
          class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm items-center justify-center p-4">

          <div class="relative w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl p-8 shadow-2xl">

            <h2 class="text-2xl font-semibold text-white mb-6">
              Excluir usuário
            </h2>

            <label class=" text-slate-200 font-medium ">
              Tem certeza que deseja excluir este usuário?
              Essa ação não poderá ser desfeita.
            </label>
            <br><br>


            <button onclick="cancelarExcluir()"
              class="w-45 py-2 border bg-slate-400 hover:bg-slate-500 rounded-lg font-medium transition-colors cursor-pointer">
              Cancelar
            </button>

            <button onclick="confirmarExclusao()"
              class="w-45 py-2 bg-red-400 hover:bg-red-500 rounded-lg font-medium transition-colors cursor-pointer">
              Excluir
            </button>
          </div>
        </div>

      </div>

  </div>
  </div>
  </main>
</body>

</html>
