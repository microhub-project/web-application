<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microhub - Usuários</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../tailwind/output.css">
  <link rel="shortcut icon" href="/assets/img/logo/icon-128.ico" type="image/x-icon">
  <link rel="stylesheet" type="text/css"
    href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" type="text/css"
    href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css" />

  <script type="module">
    import { fillUserInfos, verifyIfUserCanAccess } from "../../js/session.js";

    window.addEventListener("DOMContentLoaded", () => {
      fillUserInfos();
      verifyIfUserCanAccess();

      if (typeof listarUsuarios === "function") listarUsuarios();
      if (typeof loadCompanyName === "function") loadCompanyName();
    });
  </script>
  <script src="./script.js"></script>
  <script src="../../js/toast.js"></script>

</head>

<body class="bg-slate-200 text-slate-50 font-mono font-normal overflow-x-hidden antialiased relative min-h-dvh">

  <div class="flex min-h-screen">

    <header id="header-main" class="max-lg:hidden">
      <nav
        class="w-72 fixed left-0 top-0 h-screen bg-slate-900 border-r border-slate-800 flex flex-col px-6 py-9 shrink-0 justify-between z-40">
        <div class="flex items-center justify-center -ml-5">
          <img src="/assets/img/logo/logo-light.svg" alt="Logo da Microhub" class="max-h-11">
        </div>

        <div class="flex flex-col gap-8">
          <a href="../index.html" id="navItemGeneral"
            class="text-slate-300 hover:text-blue-400 font-medium transition-colors flex items-center gap-3 text-xl cursor-pointer">
            <i class="ph ph-house text-2xl"></i> Geral
          </a>
          <a href="../reports/index.html" id="navItemReports"
            class="text-slate-300 hover:text-blue-400 font-medium transition-colors flex items-center gap-3 text-xl cursor-pointer">
            <i class="ph ph-files text-2xl"></i> Relatórios
          </a>
          <a href="../alerts/index.html" id="navItemAlerts"
            class="text-slate-300 hover:text-blue-400 font-medium transition-colors flex items-center gap-3 text-xl cursor-pointer">
            <i class="ph ph-warning text-2xl"></i> Alertas
          </a>
          <a href="../finances/index.html" id="navItemFinances"
            class="text-slate-300 hover:text-blue-400 font-medium transition-colors flex items-center gap-3 text-xl cursor-pointer">
            <i class="ph ph-money text-2xl"></i> Finanças
          </a>
          <a href="../microservices/index.html" id="navItemMicroservices"
            class="text-slate-300 hover:text-blue-400 font-medium transition-colors flex items-center gap-3 text-xl cursor-pointer">
            <i class="ph ph-cube text-2xl"></i> Microsserviços
          </a>
          <a href="../instances/index.html" id="navItemInstances"
            class="text-slate-300 hover:text-blue-400 font-medium transition-colors hidden items-center gap-3 text-xl cursor-pointer">
            <i class="ph ph-computer-tower text-2xl"></i> Instâncias
          </a>
          <a href="#" id="navItemUsers"
            class="text-slate-300 hover:text-blue-400 font-medium transition-colors hidden items-center gap-3 text-xl cursor-pointer">
            <i class="ph ph-user text-2xl"></i> Usuários
          </a>
          <a href="../codes/index.html" id="navItemCodes"
            class="text-slate-300 hover:text-blue-400 font-medium transition-colors hidden items-center gap-3 text-xl cursor-pointer">
            <i class="ph ph-lock text-2xl"></i> Códigos
          </a>
          <a href="../trash/index.html" id="navItemTrash"
            class="text-slate-300 hover:text-blue-400 font-medium transition-colors flex items-center gap-3 text-xl cursor-pointer">
            <i class="ph ph-trash text-2xl"></i> Lixeira
          </a>
        </div>
        <div class="flex justify-around items-center bg-slate-800 py-3 rounded">
          <div id="navUserIcon" class="rounded-full bg-slate-950 size-10 flex justify-center items-center font-bold">
            US
          </div>
          <div id="navUserName" class="font-semibold">
            Usuário
          </div>
          <div>
            <a onclick="logout()"><i class="ph ph-sign-out text-2xl cursor-pointer"></i></a>
          </div>
        </div>
      </nav>
    </header>

    <header id="header-mobile" class="lg:hidden">
      <nav
        class="w-20 fixed right-0 top-0 h-screen bg-slate-900 border-l border-slate-800 flex flex-col items-center px-4 py-9 shrink-0 justify-between z-40">
        <div class="flex items-center justify-center w-full">
          <img src="/assets/img/logo/icon-light.svg" alt="Logo da Microhub" class="max-h-11">
        </div>

        <div class="flex flex-col items-center justify-center gap-8 w-full">
          <a href="../index.html" id="navItemGeneralMobile"
            class="text-slate-300 hover:text-blue-400 font-medium transition-colors flex items-center justify-center text-xl cursor-pointer">
            <i class="ph ph-house text-3xl"></i>
          </a>
          <a href="../reports/index.html" id="navItemReportsMobile"
            class="text-slate-300 hover:text-blue-400 font-medium transition-colors flex items-center justify-center text-xl cursor-pointer">
            <i class="ph ph-files text-3xl"></i>
          </a>
          <a href="../alerts/index.html" id="navItemAlertsMobile"
            class="text-slate-300 hover:text-blue-400 font-medium transition-colors flex items-center justify-center text-xl cursor-pointer">
            <i class="ph ph-warning text-3xl"></i>
          </a>
          <a href="../finances/index.html" id="navItemFinancesMobile"
            class="text-slate-300 hover:text-blue-400 font-medium transition-colors flex items-center justify-center text-xl cursor-pointer">
            <i class="ph ph-money text-3xl"></i>
          </a>
          <a href="../microservices/index.html" id="navItemMicroservicesMobile"
            class="text-slate-300 hover:text-blue-400 font-medium transition-colors flex items-center justify-center text-xl cursor-pointer">
            <i class="ph ph-cube text-3xl"></i>
          </a>
          <a href="../instances/index.html" id="navItemInstancesMobile"
            class="text-slate-300 hover:text-blue-400 font-medium transition-colors hidden items-center justify-center text-xl cursor-pointer">
            <i class="ph ph-computer-tower text-3xl"></i>
          </a>
          <a href="#" id="navItemUsersMobile"
            class="text-slate-300 hover:text-blue-400 font-medium transition-colors hidden items-center justify-center text-xl cursor-pointer">
            <i class="ph ph-user text-3xl"></i>
          </a>
          <a href="../codes/index.html" id="navItemCodesMobile"
            class="text-slate-300 hover:text-blue-400 font-medium transition-colors hidden items-center justify-center text-xl cursor-pointer">
            <i class="ph ph-lock text-3xl"></i>
          </a>
          <a href="../trash/index.html" id="navItemTrashMobile"
            class="text-slate-300 hover:text-blue-400 font-medium transition-colors hidden items-center justify-center text-xl cursor-pointer">
            <i class="ph ph-trash text-3xl"></i>
          </a>
        </div>
        <div class="flex flex-col justify-center items-center p-2 gap-4 bg-slate-800 py-3 rounded w-full">
          <div id="navUserIconMobile"
            class="rounded-full bg-slate-950 size-10 flex justify-center items-center font-bold">
            US
          </div>
          <div>
            <a onclick="logout()"><i class="ph ph-sign-out text-3xl cursor-pointer"></i></a>
          </div>
        </div>
      </nav>
    </header>

    <main
      class="text-slate-900 flex flex-col p-8 max-sm:p-4 max-sm:pr-24 min-h-dvh gap-8 w-full lg:ml-72 lg:w-[calc(100%-18rem)] max-lg:pr-24">

      <div class="flex flex-col gap-4 w-full">
        <div>
          <h1 class="text-2xl max-sm:text-xl font-extrabold">Usuários</h1>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-blue-950 mt-1" id="companyName">@ Empresa</h1>
        </div>

        <hr class="border-t border-slate-400 my-2">

        <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 w-full mb-3 sm:mb-5">
          <input id="input_pesquisa"
            class="text-slate-950 bg-slate-50 w-full h-10 px-4 border border-slate-400 rounded-full text-sm outline-none focus:border-blue-600"
            placeholder="Insira o nome">

          <button onclick="Pesquisar()"
            class="px-5 py-2.5 bg-blue-500 hover:bg-blue-600 text-white font-medium rounded-full cursor-pointer flex items-center justify-center gap-2 h-10 transition-all text-sm shrink-0">
            <i class="ph ph-magnifying-glass text-lg"></i>
            Pesquisar
          </button>
        </div>

        <div id="listarUsuarios" class="w-full flex flex-col gap-3">
          <div class="hidden sm:grid grid-cols-12 px-5 font-bold text-slate-700">
            <span class="col-span-5">Nome</span>
            <span class="col-span-4">Cargo</span>
            <span class="col-span-3 text-right">Ações</span>
          </div>
        </div>

        <div id="updateUser"
          class="hidden fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm items-center justify-center p-3 sm:p-4 overflow-y-auto">

          <div
            class="relative w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl p-5 sm:p-8 shadow-2xl my-auto">

            <button onclick="fecharAtualizar()"
              class="absolute top-4 right-4 text-slate-400 hover:text-white text-2xl cursor-pointer">
              <i class="ph ph-x text-2xl sm:text-3xl"></i>
            </button>

            <h2 class="text-xl sm:text-2xl font-semibold text-white mb-4 pr-8">
              Atualizar usuário
            </h2>

            <label class="text-sm text-slate-200 font-medium mb-1 block">O que deseja atualizar?</label>

            <select id="opcaoAtualizar" class="w-full px-4 py-3 text-sm sm:text-base bg-slate-800 border border-slate-700 rounded-xl
               text-slate-100 outline-none focus:border-blue-500 transition-colors cursor-pointer"
              onchange="mostrarCampoAtualizar()">
              <option value="" class="bg-slate-800">Selecione uma opção</option>
              <option value="nome" class="bg-slate-800">Nome</option>
              <option value="email" class="bg-slate-800">E-mail</option>
              <option value="cargo" class="bg-slate-800">Cargo</option>
            </select>

            <div id="campoNome" class="hidden flex-col gap-1.5 mt-4">
              <label class="text-xs sm:text-sm text-slate-200 font-medium">Novo nome</label>
              <input id="nomeAtualizar" type="text" placeholder="Digite o novo nome" class="w-full px-4 py-3 text-sm sm:text-base bg-slate-800 border border-slate-700
               rounded-xl text-slate-100 outline-none focus:border-blue-500 transition-colors">
            </div>

            <div id="campoEmail" class="hidden flex-col gap-1.5 mt-4">
              <label class="text-xs sm:text-sm text-slate-200 font-medium">Novo e-mail</label>
              <input id="emailAtualizar" type="email" placeholder="Digite o novo e-mail" class="w-full px-4 py-3 text-sm sm:text-base bg-slate-800 border border-slate-700
               rounded-xl text-slate-100 outline-none focus:border-blue-500 transition-colors">
            </div>

            <div id="campoCargo" class="hidden flex-col gap-1.5 mt-4">
              <label class="text-xs sm:text-sm text-slate-200 font-medium">Novo cargo</label>
              <select id="cargoAtualizar" class="w-full px-4 py-3 text-sm sm:text-base bg-slate-800 border border-slate-700
               rounded-xl text-slate-100 outline-none focus:border-blue-500 transition-colors cursor-pointer">
                <option value="1" class="bg-slate-800">Gerente</option>
                <option value="2" class="bg-slate-800">FinOps</option>
                <option value="3" class="bg-slate-800">Dev/DevOps</option>
              </select>
            </div>

            <button id="btnConfirmarAtualizacao" type="button" onclick="salvarAtualizacao()"
              class="hidden w-full py-3 mt-6 bg-blue-600 hover:bg-blue-700 rounded-xl font-medium text-white transition-colors cursor-pointer items-center justify-center gap-2">
              <i class="ph ph-check text-xl"></i>
              Confirmar atualização
            </button>
          </div>
        </div>

        <div id="deleteUser"
          class="hidden fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm items-center justify-center p-3 sm:p-4 overflow-y-auto">

          <div
            class="relative w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl p-5 sm:p-8 shadow-2xl my-auto">
            <h2 class="text-xl sm:text-2xl font-semibold text-white mb-4">
              Excluir usuário
            </h2>

            <p class="text-sm sm:text-base text-slate-300 leading-relaxed mb-6">
              Tem certeza que deseja excluir este usuário? Essa ação não poderá ser desfeita.
            </p>

            <div class="flex flex-col sm:flex-row gap-2 sm:gap-4 w-full">
              <button onclick="cancelarExcluir()"
                class="w-full py-2.5 sm:py-3 border border-slate-600 hover:bg-slate-800 text-slate-200 rounded-xl font-medium transition-colors cursor-pointer text-center">
                Cancelar
              </button>

              <button onclick="confirmarExclusao()"
                class="w-full py-2.5 sm:py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl font-medium transition-colors cursor-pointer text-center">
                Excluir
              </button>
            </div>
          </div>
        </div>

      </div>
    </main>

    <div id="toast-container"
      class="fixed w-xs bottom-4 right-4 pointer-events-none z-50 max-h-[calc(100dvh-8rem)] flex flex-col-reverse gap-2 overflow-hidden">
    </div>
  </div>
</body>

</html>
